name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # uv (not pip) so the PEP 735 dev dependency-group — pytest,
      # pytest-asyncio — installs from the committed lockfile, same as local
      # development.
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        run: uv run pytest

  test-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.3
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: uv sync --locked

      - name: Run tests
        # Includes the TUI tests: the Textual TUI (unlike the old curses one)
        # runs on stock Windows, and this job is the proof.
        run: uv run pytest
